# Local development MongoDB for the Tapstate server.
#
# A single-node replica-set, not a standalone: the checkpoint compare-and-swap runs inside a
# multi-document transaction, which MongoDB only offers on a replica-set. The healthcheck initiates
# the set on first start (rs.status() throws until initiated, so the catch initiates it once), so a
# plain `docker compose up` yields a ready-to-use rs0.
#
# The server runs on the host (a JVM fat-jar) and connects to the published port, so the set member
# advertises itself as localhost:27017 — reachable from the host. This file is for local
# development only; it is not the production deployment.
services:
  mongo:
    image: mongo:7.0
    container_name: tapstate-mongo-rs
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      # Initiate the set on first boot, then hold the check red until a primary has actually been
      # elected. Asserting rs.status().ok alone would pass on a degraded set, because a shell that
      # evaluates a falsy value still exits 0; and rs.initiate() returns before the election completes,
      # so a check that stops at "initiated" reports healthy while the set still cannot accept writes.
      # Assert a writable primary, so a dependent that waits on this never connects to a set without one.
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) };
         if (!db.hello().isWritablePrimary) { quit(1) }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    volumes:
      - tapstate-mongo-data:/data/db

volumes:
  tapstate-mongo-data:
