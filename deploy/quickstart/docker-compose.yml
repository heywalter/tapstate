# Tapstate quickstart stack: the server and its state store, ready to run without a build.
#
# This is a single-node local demo, not a deployment topology. The server keeps pipeline position in
# memory, so a restart replays rather than resumes.
#
# The store service is deliberately defined exactly as the development-only store stack defines it,
# down to the advertised member address. The two differ only in how the *client* addresses the set
# (see the server's store URI below), so neither stack has to know about the other.
services:
  mongo:
    image: mongo:7.0
    # A single-member replica set rather than a standalone: one write path opens a session and
    # commits a batch as one transaction, and MongoDB offers transactions only on a replica set.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      # Initiate the set on first boot, then hold the check red until a primary has actually been
      # elected. Two traps are being avoided here. Testing rs.status().ok would pass on a degraded
      # set, because a shell that evaluates a falsy value still exits 0 -- the check has to assert
      # the value, not merely evaluate it. And rs.initiate() returns before the election completes,
      # so a check that stops at "initiated" lets a dependent start against a set that cannot yet
      # accept writes.
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) };
         if (!db.hello().isWritablePrimary) { quit(1) }"
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 20s
    volumes:
      # A named volume, so registered connectors and applied artifacts outlive `down`. Only `down -v`
      # discards them, which then costs a full re-registration of every connector jar.
      - tapstate-quickstart-mongo:/data/db

  server:
    # Built locally until the published image exists; the released stack pins a registry reference
    # here instead, so that a user runs this stack without a build.
    image: tapstate:dev
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      # The set member advertises itself under the address the host reaches it by, which is not
      # resolvable from inside this network. Addressing the member directly bypasses topology
      # discovery entirely, so the advertised address is never consulted and the member is reached
      # under its service name. This is sound only because the set has exactly one member: a direct
      # connection gives up election and failover awareness, which is why it belongs here in the
      # single-node stack's configuration and not in the server's own defaults.
      TAPSTATE_STORE_MONGO_URI: mongodb://mongo:27017/tapstate?directConnection=true
    ports:
      # Bound to the loopback interface: an unauthenticated first run must not be reachable from
      # other machines on the network.
      - "127.0.0.1:8080:8080"
    # The orderly stop closes the cluster member and the store client before halting. Docker's
    # default 10s grace can cut that short and turn a clean exit into a kill, so the window is set
    # wider than the stop has been observed to need.
    stop_grace_period: 30s

volumes:
  tapstate-quickstart-mongo:
