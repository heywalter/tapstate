# CLI native release assets — the "zero build" enabler for the quickstart: a user downloads a prebuilt
# tapstate binary for their platform instead of installing GraalVM and building it from source.
#
# Manual only (workflow_dispatch): nothing outward-facing fires on a push. On each of the four target
# platforms it builds the native binary with Liberica NIK, runs the full native smoke suite against it (offline
# verbs + one online connect/login/register round-trip), then packages
# tapstate-<version>-<os>-<arch>.tar.gz (bare binary + LICENSE + NOTICE). A final job adds a per-asset
# .sha256 and an aggregate checksums.txt and assembles a DRAFT, prerelease GitHub release. A human
# reviews the draft and publishes it — nothing is published automatically, and no :latest / floating
# pointer is ever produced (make_latest: false), which is the lever that keeps a preview build from
# looking production-ready.
#
# The public v<version> tag currently points at the initial commit with no release attached. Moving it
# to the release commit is a deliberate, outward-facing, irreversible human step: do it before
# publishing the draft, never as a side effect of this workflow. A draft release does not create or move
# the tag; publishing it does, at target_commitish. Keep that commit aligned with the one these assets
# were built from.
#
# workflow_dispatch is only offered for workflows on the default branch, so this becomes runnable once
# the branch it lives on merges to main.
#
# The multi-arch server image shares this same tag lane: one dispatch builds linux/amd64 + linux/arm64
# and pushes ghcr.io/<owner>/tapstate:<version> and :preview, never :latest (the lever that keeps a
# preview build from looking production-ready). Mind one asymmetry with the CLI assets: an image has no
# draft state. Pushing it is the only step here that cannot be taken back -- a draft release is private
# until a human publishes it, and a tag is moved by hand -- so the image job runs last, gated on the
# whole CLI half having already succeeded. The order is: build and smoke four binaries, package and
# checksum them into a private draft, then push the images.
#
# That gate is deliberate and was earned twice. The image job used to be a parallel sibling of the CLI
# matrix, so the images went out whether or not the CLI half worked: one rehearsal built no CLI assets
# at all (a retired runner label), and the next built all four and then failed packaging them. Either
# would have left public preview images with no CLI to drive them.
#
# Hence also the dry_run input: a rehearsal builds and smokes everything and publishes nothing -- both
# image architectures are built but not pushed, all four CLI assets are built, smoked, packaged and
# checksummed but no draft is created. Rehearse first, then dispatch for real.
name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearsal: build and smoke everything, publish nothing (no image push, no draft release)."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        # Portable read of the single ${revision} version source (works with BSD and GNU sed); no Maven.
        run: echo "version=$(sed -n 's/.*<revision>\(.*\)<\/revision>.*/\1/p' pom.xml | head -1)" >> "$GITHUB_OUTPUT"

  server-image:
    # The server-image half of the tag lane. The Spring Boot jar is platform-independent, so both
    # architectures share the one jar and differ only in the JRE base image and its apt layer -- which
    # is what makes building arm64 under QEMU emulation cheap here. The jar is built first and copied in
    # by the Dockerfile (the image is a runtime image, it does not build the jar itself), so the tiny
    # build context the .dockerignore admits stays tiny. There is no draft state for an image, so this
    # push is the one step that cannot be taken back -- which is why it waits for `release`: by the time
    # it runs, all four CLI binaries exist, are smoked, packaged, checksummed and staged. Depending on
    # `release` rather than on `cli-native` is the point: the CLI matrix going green does not mean the
    # assets made it into the draft, and a rehearsal proved exactly that failure.
    needs: [prepare, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push the image to GHCR under the repository's own namespace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: build the boot jar the image ships
        run: mvn -B -pl app -am -DskipTests package
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          # A rehearsal still builds both architectures (that is the part worth proving); it just does
          # not push. This is the only irreversible step in the job, so it is the only one gated.
          push: ${{ !inputs.dry_run }}
          # :<version> pins this exact build; :preview is the moving pointer the quickstart stack
          # tracks. No :latest, deliberately -- the runtime is single-node and in-memory and must not
          # be mistaken for a production default.
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.prepare.outputs.version }}
            ghcr.io/${{ github.repository }}:preview

  cli-native:
    needs: prepare
    strategy:
      fail-fast: false
      # Platform differences come from the runner + toolchain, never a Maven profile (ADR-0022 D6-3);
      # os/arch are fixed labels here so the published asset names are a stable contract, not uname output.
      # Only the newest two macOS versions are hosted, so a runner label ages out of existence rather
      # than failing loudly: a job asking for a removed one queues forever with no runner assigned and
      # never reports an error. macos-13 had already been removed and macos-14 is deprecated. The Intel
      # image now carries an explicit -intel label; the plain label is Apple Silicon.
      matrix:
        include:
          - { runner: macos-15,         os: darwin, arch: arm64 }
          - { runner: macos-15-intel,   os: darwin, arch: x64 }
          - { runner: ubuntu-latest,    os: linux,  arch: x64 }
          - { runner: ubuntu-24.04-arm, os: linux,  arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'liberica'   # Liberica NIK 21 (GPLv2+CPE) — the release toolchain; Oracle GraalVM (GFTC) is local dev only
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: register the Liberica NIK JDK as the Maven toolchain (version 21, any vendor)
        shell: bash
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/toolchains.xml <<EOF
          <toolchains>
            <toolchain>
              <type>jdk</type>
              <provides><version>21</version></provides>
              <configuration><jdkHome>${JAVA_HOME}</jdkHome></configuration>
            </toolchain>
          </toolchains>
          EOF
      - name: build the native image
        run: mvn -B -Pnative -pl cli -am -DskipTests package
      - name: native smoke (black-box against the produced binary, offline + online)
        run: bash cli/native-smoke.sh cli/target/tapstate
      # Read the macOS floor back out of the binary instead of asserting one. A native image is stamped
      # with the deployment target of the machine that built it; dyld enforces that at load time and no
      # build flag tried so far moves it, so the oldest macOS this binary can run on is a fact about this
      # runner, not a choice. Only the newest two macOS versions are hosted, so the floor rises on its own
      # as labels age out -- measuring is what keeps the published number true without anyone remembering.
      - name: measure the macOS floor this binary was stamped with
        if: matrix.os == 'darwin'
        shell: bash
        run: |
          floor="$(vtool -show-build cli/target/tapstate | awk '/minos/ { print $2; exit }')"
          [ -n "$floor" ] || { echo "vtool reported no minos for cli/target/tapstate"; exit 1; }
          echo "${{ matrix.os }}-${{ matrix.arch }} macos $floor" > "${{ matrix.os }}-${{ matrix.arch }}.minos"
          cat "${{ matrix.os }}-${{ matrix.arch }}.minos"
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'darwin'
        with:
          name: cli-minos-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ matrix.os }}-${{ matrix.arch }}.minos
          if-no-files-found: error
      - name: package the release asset
        shell: bash
        run: |
          version='${{ needs.prepare.outputs.version }}'
          asset="tapstate-${version}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          stage="$(mktemp -d)"
          cp cli/target/tapstate "$stage/tapstate"
          cp LICENSE NOTICE "$stage/"
          tar -czf "$asset" -C "$stage" tapstate LICENSE NOTICE
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    needs: [prepare, cli-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the draft release (and, only on a human publish, its tag)
    steps:
      # Take only the CLI assets. The image job's action uploads a build record artifact of its own, and
      # an unfiltered download pulls that too -- so this job's success came to depend on an artifact it
      # never uses, and one that failed to download sank the whole release step. Narrow it to the four
      # tarballs: whatever else the other jobs upload, now or later, is none of this job's business.
      - uses: actions/download-artifact@v4
        with:
          pattern: tapstate-*.tar.gz
          path: staging
          merge-multiple: true
      - name: checksums (per-asset .sha256 + aggregate checksums.txt)
        working-directory: staging
        run: |
          for f in tapstate-*.tar.gz; do sha256sum "$f" > "$f.sha256"; done
          sha256sum tapstate-*.tar.gz > checksums.txt
          ls -la
      # The measured floors, collected from the darwin legs. This is a separate, explicitly named download
      # rather than a widening of the one above: that one is narrow because it must not depend on artifacts
      # this job does not use, and these it does use.
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-minos-*
          path: minos
          merge-multiple: true
      # Publish the floors as an asset the installer reads, and say the same thing in the notes. Both come
      # from the same measurement, so the promise made to a reader and the check made on a user's machine
      # can never drift apart -- and neither needs anyone to remember to update a number.
      - name: platform-minimums.txt + the requirement sentence for the notes
        shell: bash
        run: |
          cat minos/*.minos | sort > staging/platform-minimums.txt
          cat staging/platform-minimums.txt
          distinct="$(awk '$2 == "macos" { print $3 }' staging/platform-minimums.txt | sort -u)"
          if [ "$(echo "$distinct" | wc -l)" -eq 1 ]; then
            sentence="Requires macOS $distinct or newer."
          else
            sentence="Requires $(awk '$2 == "macos" { printf "%smacOS %s or newer on %s", sep, $3, $1; sep="; " } END { print "." }' staging/platform-minimums.txt)"
          fi
          echo "MACOS_REQ=$sentence" >> "$GITHUB_ENV"
          echo "$sentence"
      - name: assemble the DRAFT prerelease (a human reviews and publishes it)
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: true
          make_latest: false
          name: tapstate v${{ needs.prepare.outputs.version }} (preview)
          body: |
            Preview build — single-node, in-memory runtime, not for production.

            Native CLI binaries for macOS (arm64 / x64) and Linux (x64 / arm64). Verify a download against
            its `.sha256` or `checksums.txt` before use. No `:latest` / floating pointer is published.

            ${{ env.MACOS_REQ }} The floor is the deployment target the build machine stamped into the
            binary, enforced when it loads, so it can rise between releases; `platform-minimums.txt` carries
            the same numbers in machine-readable form and the installer refuses a machine below them.
          files: |
            staging/tapstate-*.tar.gz
            staging/tapstate-*.tar.gz.sha256
            staging/checksums.txt
            staging/platform-minimums.txt

      # A rehearsal has proven the whole lane up to this point: four platforms built, smoked and packaged,
      # checksums generated, both image architectures built. Say plainly that nothing left the runner, so a
      # green rehearsal is never mistaken for a release.
      - name: rehearsal summary (nothing was published)
        if: ${{ inputs.dry_run }}
        working-directory: staging
        run: |
          {
            echo "### Rehearsal only — nothing was published"
            echo
            echo "No image was pushed to GHCR, no draft release was created, no tag was touched."
            echo
            echo "Assets that a real run would have staged:"
            echo '```'
            ls -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
