name: docs-followup

# A merged product PR with `docs-needed` creates one durable demand signal in tapstate/docs.
# DocsLoop owns correlation, human confirmation and Feishu delivery; this workflow only
# records the provider fact. Its machine marker makes retries and webhook/poll races idempotent.
#
# Required repository secret:
#   DOCS_REPO_TOKEN - fine-grained token for tapstate/docs, Issues: Read and write.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  notify:
    if: >
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'docs-needed')
    runs-on: ubuntu-latest
    steps:
      - name: Open docs follow-up issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DOCS_REPO_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const marker = `<!-- docsloop-source-pr: ${pr.base.repo.full_name}#${pr.number}@${pr.merge_commit_sha} -->`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: 'tapstate',
              repo: 'docs',
              state: 'all',
              labels: 'docs-needed',
              per_page: 100,
            });
            if (issues.some((issue) => issue.body?.includes(marker))) {
              core.info(`Docs follow-up already exists for ${marker}`);
              return;
            }
            const body = [
              marker,
              `Documentation follow-up for merged PR ${pr.html_url}`,
              ``,
              `**Title:** ${pr.title}`,
              `**Author:** @${pr.user.login}`,
              `**Merged at:** ${pr.merged_at}`,
              ``,
              `**Change summary:**`,
              pr.body || '(no description provided)',
            ].join('\n');
            await github.rest.issues.create({
              owner: 'tapstate',
              repo: 'docs',
              title: `[docs] ${pr.title}`,
              body,
              labels: ['docs-needed'],
              assignees: ['heywalter'],
            });
